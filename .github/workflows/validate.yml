name: validate
on:
  push:
  pull_request:
jobs:
  checkout-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Checkout, syntax and metadata checks (no Frappe, no credentials)
        run: PYTHONPATH=. python tests/check_checkout.py
